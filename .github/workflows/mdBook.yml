name: Build and Deploy mdBook
on:
  workflow_run:
    workflows: ["Format Code"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com | tar -xz
          mv mdbook /usr/local/bin/

      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundle-cache: true

      - name: Build Jekyll Site
        run: |
          bundle install
          bundle exec jekyll build --destination ./_site

      - name: Build mdBook Into Subpath
        run: |
          mdbook build -d ./_site/docs 
          # Matches the folder name you want in your URL (e.g., ://domain.com)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Combined Staging Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


