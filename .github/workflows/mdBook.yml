name: Build and Deploy mdBook Subpath

on:
  workflow_run:
    workflows: ["Deploy GitBook Mirror to GitHub Pages"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preprocess GitBook Syntax
        run: |
          # Process all Markdown files safely
          find . -type f -name "*.md" -print0 | while IFS= read -r -d '' file; do
              echo "Processing $file..."
              
              # A. Fix Bold & Entities
              sed -i 's/&#x20;/ /g' "$file" || true

              # B. Bilibili fix: (Do NOT modify it)
              sed -i -E 's|\{%[[:space:]]*embed url=".*video/(BV[a-zA-Z0-9]+).*"[[:space:]]*%\}|\n\n<iframe src="//player.bilibili.com/player.html?isOutside=true\&aid=113882735711341\&bvid=\1\&cid=28052620619\&p=1" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="width:100%; height:480px; display:block; margin:20px 0;" markdown="0" referrerpolicy="no-referrer"></iframe>\n\n|g' "$file" || true

              # C. Support for other embeds (YouTube, etc.)
              sed -i -E 's|\{%[[:space:]]*embed url="([^"]+)"[[:space:]]*%\}|\n\n<iframe src="\1" style="width:100%; height:480px; display:block; margin:20px 0;" frameborder="0" allowfullscreen="true" markdown="0"></iframe>\n\n|g' "$file" || true

              # D. Styling Fixes (Description) & Frontmatter Removal
              if grep -q "^description:" "$file"; then
                  # Extract description safely, removing trailing carriage returns
                  DESC=$(sed -n 's/^description:[[:space:]]*\(.*\)/\1/p' "$file" | head -n 1 | tr -d '\r')
                  
                  # Robust Frontmatter Removal using an explicit address block range (1 to the 2nd --- match)
                  sed -i '1,/^---$/ { /^---$/d; d; }' "$file"
                  
                  # Insert description block safely right after the first H1 tag without text duplication
                  sed -i "0,/^# /{s|^\(# .*\)|\1\n\n> $DESC|}" "$file"
              fi
          done

      - name: Download Jekyll Artifact
        uses: actions/download-artifact@v4
        with:
          name: 'github-pages' 
          path: './_site'
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Jekyll Artifact
        run: |
          if [ -f "./_site/artifact.tar" ]; then
            tar -xf ./_site/artifact.tar -C ./_site
            rm ./_site/artifact.tar
          fi

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build mdBook Into Subpath
        run: |
          mdbook build -d ./_site/docs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Combined Staging Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
