# Site Settings
title: "Win12 Online Wiki"
description: "欢迎来到 Win12 网页版官方 Wiki！本项目由学生开发者使用 HTML、CSS 和 JS 打造，在浏览器中高度模拟 Win12 UI 介面与流畅动画。立即打开网页体验未来作业系统的互动设计！"
remote_theme: pages-themes/primer # This ensures your theme stays active

# Markdown Configuration
markdown: kramdown
kramdown:
  # This tells Jekyll to treat HTML blocks as real HTML, not text
  parse_block_html: true
  syntax_highlighter: rouge
  autolink: true
  commonmark:
    hard_wrap: false

defaults:
  - scope:
      path: "" # empty string means all files in the project
      type: "pages"
    values:
      layout: "default"
      
footer_text: "GitBook 镜像"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-sitemap

# Build Settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .github/**
  - CONTRIBUTING.md
  - .gitattributes

include:
  - favicon.svg
  - sitemap.xml

baseurl: "/win12-wiki"
url: "https://freedom-323.github.io"
keep_files: ["docs"]
